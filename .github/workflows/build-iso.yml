name: Build Linux-Universe ISO

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 480
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap syslinux-utils syslinux-common xorriso isolinux podman ostree

      - name: Run live-build
        env:
          GENISOIMAGE_OPTIONS_EXTRA: "-allow-limited-size -udf"
        run: |
          sudo lb clean
          sudo -E lb build 2>&1 | tee build.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-universe-iso
          path: '*.iso'
          if-no-files-found: error

      - name: Split ISO into <2GB parts
        if: success()
        run: |
          split -b 1900M -d --additional-suffix=.part *.iso linux-universe-iso.
          ls -la linux-universe-iso.*

      - name: Upload ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: iso-${{ github.run_number }}
          name: Linux-Universe ISO #${{ github.run_number }}
          body: |
            Автоматически собранный ISO, разбит на части (каждая < 2GB, лимит GitHub).

            Скачай ВСЕ файлы вида linux-universe-iso.*.part, затем склей их обратно:

            Linux/macOS:
            cat linux-universe-iso.*.part > linux-universe.iso

            Windows (PowerShell):
            cmd /c copy /b linux-universe-iso.00.part+linux-universe-iso.01.part+linux-universe-iso.02.part+linux-universe-iso.03.part+linux-universe-iso.04.part+linux-universe-iso.05.part linux-universe.iso

            (проверь фактическое количество частей в списке файлов ниже и подставь все имена по порядку)

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            linux-universe-iso.*.part
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
