name: Build Linux-Universe ISO

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap syslinux-utils syslinux-common xorriso isolinux
          sudo apt-get remove -y genisoimage || true
          sudo apt-mark hold genisoimage || true

      - name: Find and dump binary_iso script
        run: |
          find / -iname "binary_iso*" 2>/dev/null || true
          echo "=== content (if found) ==="
          FOUND=$(find / -iname "binary_iso*" -type f 2>/dev/null | head -1 || true)
          if [ -n "$FOUND" ]; then
            cat "$FOUND"
          else
            echo "binary_iso script not found anywhere"
            dpkg -L live-build 2>/dev/null | grep -i binary || true
          fi

      - name: Run live-build
        run: |
          sudo lb clean
          sudo lb build 2>&1 | tee build.log || true

      - name: Diagnose binary tree structure
        if: always()
        run: |
          echo "=== binary/ directory tree (3 levels) ===" | tee -a build.log
          find binary -maxdepth 3 2>&1 | tee -a build.log
          echo "=== sizes ===" | tee -a build.log
          du -sh binary/* 2>&1 | tee -a build.log
          echo "=== EFI-related files ===" | tee -a build.log
          find binary -iname "*efi*" -o -iname "*.disk*" 2>&1 | tee -a build.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-universe-iso
          path: '*.iso'
          if-no-files-found: error
