name: Build Linux-Universe ISO

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap syslinux-utils syslinux-common xorriso isolinux podman ostree

      - name: Run live-build
        env:
          GENISOIMAGE_OPTIONS_EXTRA: "-allow-limited-size -udf"
        run: |
          sudo lb clean
          sudo -E lb build 2>&1 | tee build.log

      - name: Upload build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-universe-iso
          path: '*.iso'
          if-no-files-found: error

      - name: Upload ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: iso-${{ github.run_number }}
          name: Linux-Universe ISO #${{ github.run_number }}
          body: |
            Автоматически собранный ISO
            - Commit: ${{ github.sha }}
            - Workflow run: \( {{ github.server_url }}/ \){{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            *.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
